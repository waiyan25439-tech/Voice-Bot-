name: Run Telegram Bot 24/7

on:
  schedule:
    # ၁၅ မိနစ်တစ်ကြိမ် Bot ရပ်နေလား စစ်ဆေးပြီး အလိုအလျောက် ပြန်စခိုင်းရန်
    - cron: '*/15 * * * *'
  workflow_dispatch: 

jobs:
  run-bot:
    runs-on: ubuntu-latest
    # GitHub Action ၏ ၆ နာရီ Limit မရောက်မီ ၅ နာရီခွဲ (၃၅၀ မိနစ်) တွင် အလိုအလျောက် သန့်ရှင်းစွာ ပိတ်ရန်
    timeout-minutes: 350

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # မြန်မာ အမျိုးသားအသံအတွက် edge-tts နှင့် လိုအပ်သော Library များ ထည့်သွင်းခြင်း
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-telegram-bot edge-tts asyncio

      # Bot ကို စတင် run ရန် (GitHub Secret မှ Token ကို ယူသုံးပါမည်)
      - name: Start Telegram Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python main.py
