name: Run Telegram Voice Bot

on:
  push:
    branches: [ "main" ]
  schedule:
    # ၅ နာရီတိုင်း Bot ကို အလိုအလျောက် ပြန်စခိုင်းခြင်း (၆ နာရီ Limit မထိအောင်)
    - cron: '0 */5 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Bot Script
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      run: python main.py

  # ဘော့ဒေါင်းသွားပါက သို့မဟုတ် ပိတ်သွားပါက အလိုအလျောက် ပြန် run ခိုင်းမည့် အဆင့်
  auto-restart:
    needs: run-bot
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Restart Workflow
        uses: peter-evans/repository-dispatch@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          event-type: restart-bot
